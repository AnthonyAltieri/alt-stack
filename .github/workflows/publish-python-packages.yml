name: Publish Python Packages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (build only; no publish or tagging)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release:
    name: ${{ matrix.package.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: alt-stack-openapi-pydantic
            dir: packages/python-pydantic-openapi
          - name: alt-stack-http-client-httpx
            dir: packages/python-http-client-httpx
    environment:
      name: pypi
      url: https://pypi.org/project/${{ matrix.package.name }}/
    permissions:
      contents: write
      id-token: write
    env:
      PACKAGE_DIR: ${{ matrix.package.dir }}
      DIST_DIR: dist/${{ matrix.package.name }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Detect unpublished package version
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          EXPECTED_NAME: ${{ matrix.package.name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_DRY_RUN" == "true" ]]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

          python <<'PY'
          import json
          import os
          import sys
          import tomllib
          import urllib.error
          import urllib.request
          from pathlib import Path

          package_dir = Path(os.environ["PACKAGE_DIR"])
          metadata = tomllib.loads(package_dir.joinpath("pyproject.toml").read_text())
          project = metadata["project"]
          package_name = project["name"]
          package_version = project["version"]

          expected_name = os.environ["EXPECTED_NAME"]
          if package_name != expected_name:
              print(f"pyproject name {package_name!r} does not match matrix entry {expected_name!r}")
              sys.exit(1)

          try:
              with urllib.request.urlopen(f"https://pypi.org/pypi/{package_name}/json") as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              payload = {"releases": {}}

          version_exists = package_version in payload.get("releases", {})
          should_publish = not version_exists

          if version_exists:
              print(f"✓ {package_name}@{package_version} is already on PyPI - skipping publish")
          else:
              print(f"📦 {package_name}@{package_version} is not on PyPI - will publish")

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"package_name={package_name}\n")
              handle.write(f"package_version={package_version}\n")
              handle.write(f"should_publish={'true' if should_publish else 'false'}\n")
          PY

      - name: Detection summary
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.detect.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.detect.outputs.package_version }}
          SHOULD_PUBLISH: ${{ steps.detect.outputs.should_publish }}
        run: |
          {
            echo "### ${PACKAGE_NAME} release detection"
            echo "- Version: \`${PACKAGE_VERSION}\`"
            if [[ "$SHOULD_PUBLISH" == "true" ]]; then
              echo "- Result: version is unpublished and eligible for release"
            else
              echo "- Result: version already exists on PyPI; no release needed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup uv
        if: steps.detect.outputs.should_publish == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false

      - name: Build distribution artifacts
        if: steps.detect.outputs.should_publish == 'true'
        shell: bash
        run: |
          rm -rf "$DIST_DIR"
          uv build "$PACKAGE_DIR" --out-dir "$DIST_DIR"

      - name: Check distribution metadata
        if: steps.detect.outputs.should_publish == 'true'
        shell: bash
        run: uvx twine check "$DIST_DIR"/*

      - name: List built artifacts
        if: steps.detect.outputs.should_publish == 'true'
        shell: bash
        run: ls -lh "$DIST_DIR"

      - name: Dry-run summary
        if: steps.detect.outputs.should_publish == 'true' && steps.detect.outputs.dry_run == 'true'
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.detect.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.detect.outputs.package_version }}
        run: |
          {
            echo "### ${PACKAGE_NAME} dry run"
            echo "- Built artifacts for \`${PACKAGE_NAME}@${PACKAGE_VERSION}\`"
            echo "- Publishing and git tagging were skipped because \`dry_run=true\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish package to PyPI
        if: steps.detect.outputs.should_publish == 'true' && steps.detect.outputs.dry_run != 'true'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: ${{ env.DIST_DIR }}
          print-hash: true

      - name: Configure git
        if: steps.detect.outputs.should_publish == 'true' && steps.detect.outputs.dry_run != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push git tag
        if: steps.detect.outputs.should_publish == 'true' && steps.detect.outputs.dry_run != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ steps.detect.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.detect.outputs.package_version }}
        run: |
          TAG_NAME="${PACKAGE_NAME}@${PACKAGE_VERSION}"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME" 2>/dev/null || echo "Tag $TAG_NAME already exists"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" push origin "$TAG_NAME" || echo "Tag $TAG_NAME already exists on origin"

      - name: Release summary
        if: steps.detect.outputs.should_publish == 'true' && steps.detect.outputs.dry_run != 'true'
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.detect.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.detect.outputs.package_version }}
        run: |
          {
            echo "### ${PACKAGE_NAME} release"
            echo "- Published \`${PACKAGE_NAME}@${PACKAGE_VERSION}\` to PyPI"
            echo "- Tagged \`${PACKAGE_NAME}@${PACKAGE_VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
