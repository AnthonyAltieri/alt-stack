[project]
name = "alt-stack-openapi-pydantic"
version = "1.6.2"
description = "Generate Pydantic models, typed route maps, and an asyncio client from OpenAPI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = ["pydantic[email]>=2.7.0"]

[project.urls]
Homepage = "https://github.com/anthonyaltieri/alt-stack"
Repository = "https://github.com/anthonyaltieri/alt-stack"
Issues = "https://github.com/anthonyaltieri/alt-stack/issues"

[project.optional-dependencies]
dev = [
  "alt-stack-http-client-httpx",
  "pyrefly>=1.0.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "ty>=0.0.78",
]

[project.scripts]
alt-stack-openapi-pydantic = "alt_stack_openapi_pydantic.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["alt_stack_openapi_pydantic*"]

[tool.setuptools.package-data]
"alt_stack_openapi_pydantic" = ["py.typed"]

[tool.uv.sources]
alt-stack-http-client-httpx = { path = "../python-http-client-httpx" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
